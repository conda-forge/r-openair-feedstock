{% set version = "3.0.0" %}
{% set posix = 'm2-' if win else '' %}

package:
  name: r-openair
  version: {{ version|replace("-", "_") }}

source:
  url:
    - {{ cran_mirror }}/src/contrib/openair_{{ version }}.tar.gz
    - {{ cran_mirror }}/src/contrib/Archive/openair/openair_{{ version }}.tar.gz
  sha256: 217928cfe9d2df77c27a649f486ce65a3fe4b36a575d0019b5aa2f9c8e8ce5a2

build:
  number: 0
  rpaths:
    - lib/R/lib/
    - lib/
  missing_dso_whitelist:
    - '*/R.dll'        # [win]
    - '*/Rblas.dll'    # [win]
    - '*/Rlapack.dll'  # [win]

requirements:
  build:
    - {{ compiler('c') }}          # [not win]
    - {{ stdlib("c") }}            # [not win]
    - {{ compiler('m2w64_c') }}    # [win]
    - {{ stdlib("m2w64_c") }}      # [win]
    - {{ compiler('cxx') }}        # [not win]
    - {{ compiler('m2w64_cxx') }}  # [win]
    - {{ posix }}filesystem        # [win]
    - {{ posix }}make
    - {{ posix }}sed               # [win]
    - {{ posix }}coreutils         # [win]
    - {{ posix }}zip               # [win]
    - cross-r-base {{ r_base }}    # [build_platform != target_platform]
  host:
    - r-base
    - r-mass
    - r-rcpp
    - r-cli
    - r-cluster
    - r-dplyr >=1.2
    - r-ggplot2 >=4.0.0
    - r-lubridate
    - r-mgcv
    - r-patchwork
    - r-purrr >=1.0.0
    - r-readr
    - r-rlang
    - r-scales
    - r-tidyr
  run:
    - r-base
    - r-mass
    - r-rcpp
    - r-cli
    - r-cluster
    - r-dplyr >=1.2
    - r-ggplot2 >=4.0.0
    - r-lubridate
    - r-mgcv
    - r-patchwork
    - r-purrr >=1.0.0
    - r-readr
    - r-rlang
    - r-scales
    - r-tidyr

test:
  commands:
    - $R -e "library('openair')"           # [not win]
    - "\"%R%\" -e \"library('openair')\""  # [win]

about:
  home: https://openair-project.github.io/openair/
  dev_url: https://github.com/openair-project/openair
  license: MIT
  summary: Tools to analyse, interpret and understand air pollution data. Data are typically
    regular time series and air quality measurement, meteorological data and dispersion
    model output can be analysed. The package is described in Carslaw and Ropkins (2012,
    <doi:10.1016/j.envsoft.2011.09.008>) and subsequent papers.
  license_family: MIT
  license_file:
    - {{ environ["PREFIX"] }}/lib/R/share/licenses/MIT
    - LICENSE

extra:
  recipe-maintainers:
    - conda-forge/r
